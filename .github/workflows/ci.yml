name: test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'evals/**'
      - 'examples/**'
      - 'demo/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'evals/**'
      - 'examples/**'
      - 'demo/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: policy-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs
